# Data is stored in ./data on your machine (bind mount).
# Create the folder or let Docker create it on first run.
services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3001
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:' + (process.env.PORT || '3001') + '/api/health', { signal: AbortSignal.timeout(3000) }); process.exit(response.status === 200 ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
