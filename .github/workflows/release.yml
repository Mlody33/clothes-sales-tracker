name: Build and publish tagged image

on:
  push:
    tags: [ '**' ]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Build frontend (includes TypeScript check)
        run: bun run build

  build:
    name: Build ARM64 Docker image
    needs: checks
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          outputs: type=docker,dest=${{ runner.temp }}/clothes-sales-tracker-arm64.tar
          tags: |
            ghcr.io/mlody33/clothes-sales-tracker:latest
            ghcr.io/mlody33/clothes-sales-tracker:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: clothes-sales-tracker-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/clothes-sales-tracker-arm64.tar
          compression-level: 0
          retention-days: 1

  push:
    name: Push image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: clothes-sales-tracker-arm64-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: docker load --input "${{ runner.temp }}/clothes-sales-tracker-arm64.tar"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker push ghcr.io/mlody33/clothes-sales-tracker:latest
          docker push "ghcr.io/mlody33/clothes-sales-tracker:${IMAGE_TAG}"
